<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>

    <style>
        body {
            background-color: #fafafa;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 350px;
            margin: 80px auto;
            padding: 40px;
            background-color: white;
            border: 1px solid #ddd;
            text-align: center;
        }

        h1 {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 30px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            width: 96%;
            padding: 10px;
            margin-top: 10px;
            background-color: #3897f0;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .or {
            margin: 20px;
            color: gray;
        }

        a {
            color: #385185;
            text-decoration: none;
        }

        .signup {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Instagram</h1>

        <input type="text" placeholder="Phone number, username, or email">

        <input type="password" placeholder="Password">

        <button>Log In</button>

        <div class="or">OR</div>

        <a href="#">Log in with Facebook</a>

        <p>
            <a href="#">Forgot password?</a>
        </p>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign up</a>
        </div>

    </div>

</body>
</html>
