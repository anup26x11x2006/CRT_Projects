<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #30205b, #65b76b);
        }

        .container {
            padding: 25px;
            background: #f4f0d4;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        h1 {
            width: fit-content;
            margin: 0 auto 20px;
            padding: 4px 15px;
            font-family: Georgia, serif;
            font-size: 38px;
            font-weight: normal;
            color: #228b22;
            border: 2px solid #228b22;
            border-radius: 4px;
        }

        .ludo-board {
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 4px solid #222;
            background: white;
        }

        .cell {
            border: 1px solid #777;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .red-home {
            grid-column: 1 / 7;
            grid-row: 1 / 7;
            background: #e53935;
            padding: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 22px;
            border: 1px solid #555;
        }

        .green-home {
            grid-column: 10 / 16;
            grid-row: 1 / 7;
            background: #43a047;
            padding: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 22px;
            border: 1px solid #555;
        }

        .yellow-home {
            grid-column: 1 / 7;
            grid-row: 10 / 16;
            background: #fbc02d;
            padding: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 22px;
            border: 1px solid #555;
        }

        .blue-home {
            grid-column: 10 / 16;
            grid-row: 10 / 16;
            background: #1e88e5;
            padding: 28px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 22px;
            border: 1px solid #555;
        }

        .token {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
        }

        .red-token {
            background: #b71c1c;
            color: white;
        }

        .green-token {
            background: #1b5e20;
            color: white;
        }

        .yellow-token {
            background: #f57f17;
            color: white;
        }

        .blue-token {
            background: #0d47a1;
            color: white;
        }

        .path {
            background: white;
        }

        .red-path {
            background: #ef5350;
        }

        .green-path {
            background: #66bb6a;
        }

        .yellow-path {
            background: #ffca28;
        }

        .blue-path {
            background: #42a5f5;
        }

        .safe {
            font-size: 23px;
            font-weight: bold;
        }

        .center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            border: 1px solid #333;
        }

        .center-red {
            background: #e53935;
        }

        .center-green {
            background: #43a047;
        }

        .center-yellow {
            background: #fbc02d;
        }

        .center-blue {
            background: #1e88e5;
        }

        .center div {
            border: 1px solid rgba(0, 0, 0, 0.25);
        }

        .red-lane {
            background: #ef5350;
        }

        .green-lane {
            background: #66bb6a;
        }

        .yellow-lane {
            background: #ffca28;
        }

        .blue-lane {
            background: #42a5f5;
        }

        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 30px;
            }

            .ludo-board {
                width: 90vw;
                height: 90vw;
                max-width: 600px;
                max-height: 600px;
            }

            .token {
                width: 65%;
                height: 65%;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Ludo Board </h1>

        <div class="ludo-board">

            <div class="red-home">
                <div class="token red-token">1</div>

            <div class="center">
                <div class="center-green"></div>

        </div>

    </div>

</body>

</html>
