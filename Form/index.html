<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #64ffb771;
            padding: 50px;
        }
        form {
            background-color: #64ffb7;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 2px solid black;
            border-radius: 11px;
        }
        button {
            background-color: #cbff64;
            color:black;
            padding: 10px 15px;
            border: 2px solid black;
            border-radius: 11px;
            cursor: pointer;
        }
        button:hover {
            background-color: #52f639;
        }
    </style>


</head>
<body>
    <h1 style="text-align: center;">☠ Student Registration Form</h1>

    <form action="/Data" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name" required >
        <autocapitalize="on" autocorrect="on" spellcheck="true"></autocapitalize><br><br>

        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name" required>
        <autocapitalize="on" autocorrect="on" spellcheck="true"></autocapitalize><br><br>

        <label for="contact">Contact:</label>
        <input type="text" id="contact" name="contact" required placeholder="Enter your contact number" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other" required>
        <label for="other">Other</label><br><br>

        <label for="college">College:</label>
        <input type="text" id="college" name="college" required placeholder="Enter your college name" required>
        <autocapitalize="on" autocorrect="on" spellcheck="true"></autocapitalize><br><br>

        <label for="registration_number">Registration Number:</label>
        <input type="text" id="registration_number" name="registration_number" required placeholder="Enter your registration number" required><br><br>

        <label for="course">Course: </label>
        <select id="course" name="course" required>
            <option value="">Select your course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="MBA">MBA</option>
            <option value="PhD">PhD</option>
        </select><br><br>

        <label for="college_email">Email:</label>
        <input type="email" id="college_email" name="_replyto" required placeholder="Enter your college email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" required placeholder="Enter your message" required></textarea><br><br>

        <button type="submit">Send</button>
    </form>
</body>
</html>
