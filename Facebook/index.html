<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>

    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            text-align: center;
        }

        h1 {
            color: #1877f2;
            font-size: 45px;
            margin-bottom: 10px;
        }

        .login {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px gray;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 6px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .login-btn {
            width: 98%;
            padding: 12px;
            margin-top: 8px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        a {
            color: #1877f2;
            text-decoration: none;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        .create-btn {
            background-color: #42b72a;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>facebook</h1>

        <p>Facebook helps you connect and share with the people in your life.</p>

        <div class="login">

            <input type="text" placeholder="Email address or phone number">

            <input type="password" placeholder="Password">

            <button class="login-btn">Log In</button>

            <p>
                <a href="#">Forgotten password?</a>
            </p>

            <hr>

            <button class="create-btn">Create New Account</button>

        </div>

    </div>

</body>
</html>
